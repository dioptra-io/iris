name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - uses: dioptra-io/setup-poetry-action@v1
      - name: Start services
        run: docker compose up -d -t 0 traefik clickhouse minio postgres redis
      - name: Install caracal
        run: |
          sudo curl -L -o /usr/bin/caracal https://github.com/dioptra-io/caracal/releases/download/v0.15.3/caracal-linux-amd64
          sudo chmod +x /usr/bin/caracal
      - name: Install package
        run: poetry install
      - name: Run tests
        timeout-minutes: 20
        run: sudo $(poetry env info -p)/bin/pytest --cov=iris --cov-report=xml --log-cli-level=INFO -m "not cifail" -o faulthandler_timeout=120
      - name: Dump services
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --tail=200 minio postgres clickhouse
          docker compose exec -T postgres psql -U iris -c "SELECT pid, datname, state, wait_event_type, wait_event, left(query, 80) FROM pg_stat_activity WHERE backend_type = 'client backend';"
      - uses: codecov/codecov-action@v3

  docker:
    if: "!contains(github.event.head_commit.message, 'skip docker build')"
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - iris-agent
          - iris-api
          - iris-worker
    steps:
      - uses: actions/checkout@v3
      - uses: dioptra-io/publish-docker-action@v1
        with:
          file: ./dockerfiles/${{ matrix.image }}.dockerfile
          image: dioptra-io/iris/${{ matrix.image }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.actor != 'dependabot[bot]' }}
