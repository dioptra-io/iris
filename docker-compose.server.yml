# Iris control plane (NO traefik, NO agent) for a Linux server.
# All data lives under ./data (i.e. /storage/iris/data) so root stays empty.
# Secrets come from .env (see server.env.example).
#
#   docker compose -f docker-compose.server.yml build
#   docker compose -f docker-compose.server.yml up -d
#
# Agents (on GCP) connect to this host's public IP on:
#   Redis  6379   MinIO/S3  9000
# API (8000) and ClickHouse (8123) are bound to localhost -> reach them via an
# SSH tunnel, e.g.  ssh -L 8000:localhost:8000 -L 8123:localhost:8123 <host>

name: iris

x-iris-env: &iris-env
  DATABASE_URL: "postgresql://iris:${POSTGRES_PASSWORD:-iris}@postgres/iris"
  CLICKHOUSE_BASE_URL: "http://clickhouse:8123"
  CLICKHOUSE_USERNAME: "iris"
  CLICKHOUSE_PASSWORD: "iris"
  CLICKHOUSE_DATABASE: "iris"
  REDIS_URL: "redis://default:${REDIS_PASSWORD:-iris}@redis:6379"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
  S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  S3_REGION_NAME: "local"

services:
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:22.8
    volumes:
      - "./data/clickhouse:/var/lib/clickhouse"
      - "./configuration/clickhouse/users.d:/etc/clickhouse-server/users.d:ro"
      - "./configuration/clickhouse/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "127.0.0.1:8123:8123"   # query via SSH tunnel only
    restart: unless-stopped

  postgres:
    image: postgres:16.1
    # Each worker job holds a connection for its measurement's lifetime; the default 100 ran out.
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-iris}"
      POSTGRES_DB: iris
    volumes:
      - "./data/postgres:/var/lib/postgresql/data"
    healthcheck:
      # -h forces TCP: the temporary server used during first-run init only
      # listens on the unix socket, so this can't pass before POSTGRES_DB exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U iris -d iris"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:6
    command: "redis-server --requirepass ${REDIS_PASSWORD:-iris} --appendonly yes"
    volumes:
      - "./data/redis:/data"
    ports:
      - "6379:6379"             # PUBLIC: agents connect here (set a strong password!)
    restart: unless-stopped

  minio:
    # MinIO RELEASE.2026-09-22T19-25-18Z. Docker Hub/quay now require auth; Chainguard only publishes :latest for free, so pin by digest.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    user: "0:0"  # image runs as 65532; ./data/minio bind mount is root-owned
    command: "server /data --console-address :9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - "./data/minio:/data"
    ports:
      - "9000:9000"             # PUBLIC: agents fetch/upload objects here
      - "127.0.0.1:9001:9001"   # console via SSH tunnel only
    restart: unless-stopped

  # One-shot: apply DB migrations, then exit. Runs before api/worker.
  migrate:
    build: { context: ., dockerfile: ./dockerfiles/iris-api.dockerfile }
    image: iris-api:research
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment:
      <<: *iris-env
      # Initial admin user, created only when the database is first migrated.
      IRIS_USERNAME: "${IRIS_USERNAME:-admin@example.org}"
      IRIS_PASSWORD: "${IRIS_PASSWORD:-admin}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: { context: ., dockerfile: ./dockerfiles/iris-api.dockerfile }
    image: iris-api:research
    environment:
      <<: *iris-env
      # Creating a measurement on all agents validates the target file once per agent in-request;
      # the default 30 s timeout and single worker made such requests time out and block the API.
      GUNICORN_CMD_ARGS: "--timeout 3600 --workers 4"
    ports:
      - "127.0.0.1:8000:8000"   # reach via SSH tunnel
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: ./dockerfiles/iris-worker.dockerfile }
    image: iris-worker:research
    # 128 concurrent measurement-agent jobs (each holds a Postgres connection); >= 39 agents x ~3 parts.
    command: ["/app/.venv/bin/python3", "-m", "iris.worker", "--processes", "8", "--threads", "16"]
    environment: *iris-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
